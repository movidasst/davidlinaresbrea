name: Publish David social preview (one time)
on:
  push:
    paths:
      - '.github/workflows/publish-david-preview.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare image dependency
        run: python -m pip install Pillow
      - name: Build preview image
        run: |
          python - <<'PY'
          import io, urllib.request
          from PIL import Image, ImageFilter
          from pathlib import Path
          url = "https://media.canva.com/v2/image-resize/format:PNG/height:105/quality:100/uri:ifs%3A%2F%2FM%2F163a8aa8-887b-42b0-8e01-30578885405f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGfVy-OJdhggBGg4OYHFNAs3sVvoKoDTvExLmjXN5fKu&exp=1792571675&osig=AAAAAAAAAAAAAAAAAAAAAIHPxAQ5VQJQZkK-AN4fbRhszoOI-ue55wsp2JfAMfg8&signer=media-rpc&token=AAIAAU0AJDE2M2E4YWE4LTg4N2ItNDJiMC04ZTAxLTMwNTc4ODg1NDA1ZgAAAAABoV2ZEXgyNZQkN___IDBwVJMVa-Y-u5zB4ByCrY4BDoAZdmMQRA&x-canva-quality=thumbnail"
          targets = [url.replace('height:105','height:909').replace('width:200','width:1731'), url]
          im = None
          for target in targets:
              try:
                  request = urllib.request.Request(target, headers={'User-Agent': 'Mozilla/5.0'})
                  data = urllib.request.urlopen(request, timeout=25).read()
                  candidate = Image.open(io.BytesIO(data)).convert('RGB')
                  if im is None or candidate.width > im.width: im = candidate
                  if candidate.width >= 1200: break
              except Exception as exc: print('Size candidate unavailable:', str(exc)[:150])
          if im is None: raise RuntimeError('Image source was not accessible')
          print('Fetched image:', im.size)
          im = im.resize((1200,630), Image.Resampling.LANCZOS)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.3, percent=85, threshold=3))
          out = Path('og-david-linares-20261021.jpg')
          im.save(out, 'JPEG', quality=91, optimize=True, progressive=True, subsampling=0)
          print('Saved file:', out, 'bytes', out.stat().st_size)
          PY
      - name: Publish preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-david-linares-20261021.jpg
          git commit -m "Add WhatsApp preview image for David Linares Brea" || exit 0
          git push
